[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-eda"
version = "0.1.0"
description = "Agent-friendly CLI over EDA tools: doctor, lint, sim, cov, wave-query, vplan, evidence. JSON everywhere."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mayur Kubavat" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
control-eda = "control_eda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["control_eda*"]

[tool.setuptools.package-data]
control_eda = ["templates/*.cpp"]
